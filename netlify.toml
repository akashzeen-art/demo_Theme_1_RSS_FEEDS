[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# RSS API proxy (must stay above SPA catch-all)
[[redirects]]
  from = "/api/rss"
  to = "/.netlify/functions/rss"
  status = 200
  force = true

# Article HTML proxy for in-app iframes
[[redirects]]
  from = "/api/article"
  to = "/.netlify/functions/article"
  status = 200
  force = true

# SPA client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
